# The checks anyone can run, on every push to this public repository: the contracts' tests and the
# offline NEAR checks. No secrets and no keys. The README's "How we checked it" names both.
# (Published from mirror/ci.yml of our working repository, whose own CI runs more.)
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The same Foundry the contracts were built and verified with.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge build --sizes
      - run: forge test

  receipts:
    name: cargo test (NEAR contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/near-receipts
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: cargo test --locked

  near:
    name: near:check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
