[package]
name = "lummy-receipts"
description = "Lummy's receipt registry on NEAR: verifies the signature of a NEAR AI TEE receipt and keeps it"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Lummy-Ticket/lummy"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" is where the SDK keeps ecrecover; the host function itself is a stable part of the protocol.
near-sdk = { version = "5.30.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
